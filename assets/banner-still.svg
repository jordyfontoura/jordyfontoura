<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Fontoura</title>
  <desc id="desc">Jordy Fontoura: engenheiro de IA, com RAG, agentes e MCP; carreira em software desde 2018; TypeScript, Python e Rust. Companheiro de código estático, sem animação.</desc>
  <defs>    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>


    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="900" height="300" rx="24"/>
    </clipPath>
    <clipPath id="command-mask"><rect class="reveal" x="40" y="250" width="367" height="40"/></clipPath>
  </defs>
  <style>
    .name { font:700 38px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#fafafa; letter-spacing:-1px; }
    .role { font:500 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#e4e4e7; }
    .body { font:400 21px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .caption { font:400 21px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .terminal { font:500 18px ui-monospace,Consolas,monospace; fill:#d4d4d8; }

    .companion { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .companion-outline { stroke:#e4e4e7; stroke-width:1.8; }
    .companion-screen { fill:#09090b; stroke:#71717a; stroke-width:1.4; }
    .companion-detail,.companion-mast { stroke:#a1a1aa; stroke-width:1.6; }
    .companion-prompt,.companion-cursor { stroke:#fafafa; stroke-width:2.5; }
    .companion-ground { stroke:#3f3f46; stroke-width:1; }
    .companion-shadow { stroke:#71717a; stroke-width:2; opacity:.5; animation:none; }
    .companion-idle { transform-origin:100px 85px; animation:none; }
    .companion-antenna { fill:#d4d4d8; animation:none; }
    .companion-halo { fill:#d4d4d8; opacity:.07; }
    .companion-cursor { animation:none; }
    @keyframes companion-idle {
      0%,100% { transform:translateY(0px) rotate(-1deg); }
      50% { transform:translateY(-4px) rotate(1deg); }
    }
    @keyframes companion-shadow { 0%,100% { opacity:.5; } 50% { opacity:.25; } }
    @keyframes companion-receive { 0%,100% { opacity:.55; } 40% { opacity:1; } }
    @keyframes companion-cursor { 0%,100% { opacity:1; } 50% { opacity:.4; } }
    .reveal { width:367px; animation:none; }
    .caret { fill:#d4d4d8; opacity:0; animation:none; }
    @keyframes typing { from { width:0px; } to { width:367px; } }
    @keyframes cursor { 0% { transform:translateX(0px); opacity:1; } 99% { opacity:1; } 100% { transform:translateX(367px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .companion-idle,.companion-antenna,.companion-cursor,.companion-shadow,.reveal,.caret { animation:none; } }
  </style>
  <g clip-path="url(#card)">
        <rect width="900" height="300" fill="#09090b"/>
    <rect width="900" height="300" fill="url(#dots)"/>
    <rect width="900" height="300" fill="url(#glow)"/>
    <path d="M0,52 H900" stroke="#27272a"/>
    <circle cx="24" cy="26" r="4" fill="#52525b"/><circle cx="40" cy="26" r="4" fill="#52525b"/><circle cx="56" cy="26" r="4" fill="#d4d4d8"/>
    <text x="80" y="32" class="terminal">jordy / laboratório de IA</text>
    <g class="companion" transform="translate(620 62) scale(1.15)">
      <path class="companion-ground" d="M38 147H162"/>
      <path class="companion-shadow" d="M75 153H125"/>
      <g class="companion-idle">
        <circle class="companion-halo" cx="100" cy="25" r="9"/>
        <path class="companion-mast" d="M100 29V43"/>
        <rect class="companion-antenna" x="96" y="21" width="8" height="8" rx="1"/>
        <path class="companion-outline" d="M68 43H132V54H146V103H132V114H68V103H54V54H68Z"/>
        <rect class="companion-screen" x="65" y="57" width="70" height="36" rx="2"/>
        <path class="companion-prompt" d="M77 67L86 75L77 83"/>
        <path class="companion-cursor" d="M98 83H117"/>
        <path class="companion-detail" d="M79 103H95 M102 103H121 M54 73H44V99 M146 73H156V99 M68 114V130H83 M132 114V130H117"/>
      </g>
    </g>
    <text x="40" y="98" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="132" class="role">Engenheiro de IA</text><text x="40" y="170" class="body">RAG · agentes · MCP</text><text x="40" y="198" class="body">TypeScript · Python · Rust</text><text x="40" y="234" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="276" class="terminal" clip-path="url(#command-mask)" textLength="367" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="261" width="2" height="18"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="24" fill="none" stroke="#27272a"/>
</svg>
