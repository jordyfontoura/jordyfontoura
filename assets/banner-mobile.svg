      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="600" height="380" rx="24"/>
    </clipPath>
  </defs>
