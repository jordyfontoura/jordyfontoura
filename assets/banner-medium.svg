<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Fontoura</title>
  <desc id="desc">Jordy Fontoura: engenheiro de IA, com RAG, agentes e MCP; desenvolvedor desde 2018; TypeScript, Python e Rust. Rede neural animada em um terminal; movimento termina em menos de cinco segundos.</desc>
  <defs>    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3f3f46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="600" height="550" rx="24"/>
    </clipPath></defs>
  <style>
    .name { font:700 46px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#fafafa; letter-spacing:-2px; }
    .role { font:500 30px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#e4e4e7; }
    .body { font:400 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .caption { font:400 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .terminal,.core { font:500 18px ui-monospace,Consolas,monospace; fill:#76e4bb; }
    .mesh { stroke:#76e4bb; stroke-opacity:.17; fill:none; }
    .neuron { fill:#76e4bb; animation:activate 3.8s ease-in-out 1; }
    .orbit { fill:none; stroke:#76e4bb; stroke-opacity:.6; stroke-dasharray:2 12; animation:orbit 4.8s linear 1; }
    .packet { fill:none; stroke:#76e4bb; stroke-width:2; stroke-dasharray:12 320; animation:transfer 4.8s ease-out 1; opacity:.7; }
    @keyframes orbit { to { stroke-dashoffset:-168; } }
    @keyframes transfer { from { stroke-dashoffset:332; } to { stroke-dashoffset:0; } }
    @keyframes activate { 0%,100% { opacity:.65; } 45% { opacity:1; r:5; } }
    @media (prefers-reduced-motion:reduce) { .neuron,.orbit,.packet { animation:none; } }
  </style>
  <g clip-path="url(#card)">
        <rect width="600" height="550" fill="#09090b"/>
    <rect width="600" height="550" fill="url(#dots)"/>
    <rect width="600" height="550" fill="url(#glow)"/>
    <path d="M0,52 H600" stroke="#27272a"/>
    <circle cx="24" cy="26" r="4" fill="#52525b"/><circle cx="40" cy="26" r="4" fill="#52525b"/><circle cx="56" cy="26" r="4" fill="#76e4bb"/>
    <text x="80" y="32" class="terminal">jordy / laboratório de IA</text>
