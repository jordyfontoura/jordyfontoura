path class="mesh" d="M648.2,244.0 L735.0,114.0"/><circle class="neuron" style="animation-delay:0.525s" cx="648.2" cy="244.0" r="3"/><path class="mesh" d="M641.0,208.0 L771.0,121.2"/><circle class="neuron" style="animation-delay:0.560s" cx="641.0" cy="208.0" r="3"/><path class="mesh" d="M648.2,172.0 L801.5,141.5"/><circle class="neuron" style="animation-delay:0.595s" cx="648.2" cy="172.0" r="3"/><path class="mesh" d="M668.5,141.5 L821.8,172.0"/><circle class="neuron" style="animation-delay:0.630s" cx="668.5" cy="141.5" r="3"/><path class="mesh" d="M699.0,121.2 L780.1,208.0"/><circle class="neuron" style="animation-delay:0.665s" cx="699.0" cy="121.2" r="3"/><path class="mesh" d="M735.0,114.0 L766.9,239.9"/><circle class="neuron" style="animation-delay:0.700s" cx="735.0" cy="114.0" r="3"/><path class="mesh" d="M771.0,121.2 L735.0,253.1"/><circle class="neuron" style="animation-delay:0.735s" cx="771.0" cy="121.2" r="3"/><path class="mesh" d="M801.5,141.5 L703.1,239.9"/><circle class="neuron" style="animation-delay:0.770s" cx="801.5" cy="141.5" r="3"/><path class="mesh" d="M821.8,172.0 L689.9,208.0"/><circle class="neuron" style="animation-delay:0.805s" cx="821.8" cy="172.0" r="3"/><circle class="orbit" cx="735" cy="208" r="108"/><path class="packet" d="M627,208 H843"/><circle cx="735" cy="208" r="28" fill="#242427" stroke="#d4d4d8"/><text x="735" y="214" text-anchor="middle" class="core">IA</text>
    <text x="56" y="142" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="58" y="190" class="role">Engenharia de IA aplicada</text><text x="58" y="242" class="body">RAG · agentes · MCP</text><text x="58" y="281" class="body">TypeScript · Python · Rust</text><text x="58" y="334" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="386" class="terminal" clip-path="url(#command-mask)" textLength="520" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="364" width="2" height="27"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="409" rx="24" fill="none" stroke="#27272a"/>
</svg>
