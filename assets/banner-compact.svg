ath class="mesh" d="M427.2,180.0 L490.0,86.0"/><circle class="neuron" style="animation-delay:0.525s" cx="427.2" cy="180.0" r="3"/><path class="mesh" d="M422.0,154.0 L516.0,91.2"/><circle class="neuron" style="animation-delay:0.560s" cx="422.0" cy="154.0" r="3"/><path class="mesh" d="M427.2,128.0 L538.1,105.9"/><circle class="neuron" style="animation-delay:0.595s" cx="427.2" cy="128.0" r="3"/><path class="mesh" d="M441.9,105.9 L552.8,128.0"/><circle class="neuron" style="animation-delay:0.630s" cx="441.9" cy="105.9" r="3"/><path class="mesh" d="M464.0,91.2 L522.6,154.0"/><circle class="neuron" style="animation-delay:0.665s" cx="464.0" cy="91.2" r="3"/><path class="mesh" d="M490.0,86.0 L513.1,177.1"/><circle class="neuron" style="animation-delay:0.700s" cx="490.0" cy="86.0" r="3"/><path class="mesh" d="M516.0,91.2 L490.0,186.6"/><circle class="neuron" style="animation-delay:0.735s" cx="516.0" cy="91.2" r="3"/><path class="mesh" d="M538.1,105.9 L466.9,177.1"/><circle class="neuron" style="animation-delay:0.770s" cx="538.1" cy="105.9" r="3"/><path class="mesh" d="M552.8,128.0 L457.4,154.0"/><circle class="neuron" style="animation-delay:0.805s" cx="552.8" cy="128.0" r="3"/><circle class="orbit" cx="490" cy="154" r="82"/><path class="packet" d="M408,154 H572"/><circle cx="490" cy="154" r="24" fill="#242427" stroke="#d4d4d8"/><text x="490" y="160" text-anchor="middle" class="core">IA</text>
    <text x="40" y="98" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="132" class="role">Engenheiro de IA</text><text x="40" y="170" class="body">RAG · agentes · MCP</text><text x="40" y="198" class="body">TypeScript · Python · Rust</text><text x="40" y="234" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="286" class="terminal" clip-path="url(#command-mask)" textLength="449" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="264" width="2" height="27"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="309" rx="24" fill="none" stroke="#27272a"/>
</svg>
