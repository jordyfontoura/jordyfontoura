<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">What I build</title>
  <desc id="desc">What I build: retrieval (RAG, pgvector), LLMs (Vercel AI SDK), tools (tool calling, MCP) and conversational agents, drawn as connected nodes in the style of the profile banner.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3f3f46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="180" rx="24"/>
    </clipPath>
    <linearGradient id="flowfadeout" gradientUnits="userSpaceOnUse" x1="1200" y1="0" x2="940" y2="0">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3f3f46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 64px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #fafafa; letter-spacing: -1.5px; }
    .lead { font: 400 32px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #d4d4d8; }
    .meta { font: 500 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #a1a1aa; }
    .eq { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif; font-style: italic; fill: #71717a; fill-opacity: 0.75; }
    .flow { fill: none; stroke: url(#flowfade); stroke-width: 1; }
    .ring { fill: none; stroke: #27272a; stroke-width: 1; }
    .edge { stroke: #3f3f46; stroke-width: 1; stroke-opacity: 0.8; }
    .node { fill: #09090b; stroke: #71717a; stroke-width: 1.5; }
    .signal { fill: none; stroke: #d4d4d8; stroke-width: 1.5; stroke-opacity: 0.8; }
    .label { font: italic 400 15px "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif; fill: #a1a1aa; }
    .stage { font: 700 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #fafafa; letter-spacing: -0.5px; }
    .detail { font: 400 20px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #a1a1aa; }
    .flow-out { stroke: url(#flowfadeout); }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="180" fill="#09090b"/>
    <rect width="1200" height="180" fill="url(#dots)"/>
    <rect width="1200" height="180" fill="url(#glow)"/>
    <path class="flow" d="M-10,42 C80,42 70,62 154,62"/>
    <path class="flow flow-out" d="M1046,62 C1130,62 1120,42 1210,42"/>
    <path class="flow" d="M-10,72 C80,72 70,72 154,72"/>
    <path class="flow flow-out" d="M1046,72 C1130,72 1120,72 1210,72"/>
    <path class="flow" d="M-10,102 C80,102 70,82 154,82"/>
    <path class="flow flow-out" d="M1046,82 C1130,82 1120,102 1210,102"/>
    <line class="edge" x1="206" y1="60" x2="434" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="206" y1="60" x2="434" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="206" y1="84" x2="434" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="206" y1="84" x2="434" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="486" y1="60" x2="714" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="486" y1="60" x2="714" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="486" y1="84" x2="714" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="486" y1="84" x2="714" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="766" y1="60" x2="994" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="766" y1="60" x2="994" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="766" y1="84" x2="994" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="766" y1="84" x2="994" y2="84" stroke-opacity="0.45"/>
    <path class="signal" d="M180,72 H1020"/>
    <text class="eq" x="180" y="34" font-size="15" text-anchor="middle">sim(q, d)</text>
    <circle class="ring" cx="180" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="180" cy="72" r="18"/>
    <circle cx="180" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="180" y="128" text-anchor="middle">Retrieval</text>
    <text class="detail" x="180" y="156" text-anchor="middle">RAG · pgvector</text>
    <text class="eq" x="460" y="34" font-size="15" text-anchor="middle">p(y | x)</text>
    <circle class="ring" cx="460" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="460" cy="72" r="18"/>
    <circle cx="460" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="460" y="128" text-anchor="middle">LLMs</text>
    <text class="detail" x="460" y="156" text-anchor="middle">Vercel AI SDK</text>
    <text class="eq" x="740" y="34" font-size="15" text-anchor="middle">f(args)</text>
    <circle class="ring" cx="740" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="740" cy="72" r="18"/>
    <circle cx="740" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="740" y="128" text-anchor="middle">Tools</text>
    <text class="detail" x="740" y="156" text-anchor="middle">tool calling · MCP</text>
    <text class="eq" x="1020" y="34" font-size="15" text-anchor="middle">π(a | s)</text>
    <circle class="ring" cx="1020" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="1020" cy="72" r="18"/>
    <circle cx="1020" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="1020" y="128" text-anchor="middle">Agents</text>
    <text class="detail" x="1020" y="156" text-anchor="middle">conversational</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="179" rx="24" fill="none" stroke="#27272a"/>
</svg>
