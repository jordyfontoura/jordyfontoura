<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">O que construo</title>
  <desc id="desc">O que construo: busca (RAG, pgvector), LLMs (Vercel AI SDK), ferramentas (tool calling, MCP) e agentes de conversa, em etapas conectadas no estilo do banner.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3f3f46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="900" height="180" rx="24"/>
    </clipPath>
    <linearGradient id="flowfadeout" gradientUnits="userSpaceOnUse" x1="900" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3f3f46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <style>
    .eq { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif; font-style: italic; fill: #71717a; fill-opacity: 0.75; }
    .flow { fill: none; stroke: url(#flowfade); stroke-width: 1; }
    .ring { fill: none; stroke: #27272a; stroke-width: 1; }
    .edge { stroke: #3f3f46; stroke-width: 1; stroke-opacity: 0.8; }
    .node { fill: #09090b; stroke: #71717a; stroke-width: 1.5; }
    .signal { fill: none; stroke: #76e4bb; stroke-width: 2; stroke-opacity: 0.8; stroke-dasharray: 12 8; animation: flow 4.8s linear 1; }
    @keyframes flow { to { stroke-dashoffset: -160; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }

    .stage { font: 700 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #fafafa; letter-spacing: -0.5px; }
    .detail { font: 400 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #a1a1aa; }
    .flow-out { stroke: url(#flowfadeout); }
  </style>
  <g clip-path="url(#card)">
    <rect width="900" height="180" fill="#09090b"/>
    <rect width="900" height="180" fill="url(#dots)"/>
    <rect width="900" height="180" fill="url(#glow)"/>
    <path class="flow" d="M-10,42 C80,42 70,62 109,62"/>
    <path class="flow flow-out" d="M791,62 C830,62 820,42 910,42"/>
    <path class="flow" d="M-10,72 C80,72 70,72 109,72"/>
    <path class="flow flow-out" d="M791,72 C830,72 820,72 910,72"/>
    <path class="flow" d="M-10,102 C80,102 70,82 109,82"/>
    <path class="flow flow-out" d="M791,82 C830,82 820,102 910,102"/>
    <line class="edge" x1="161" y1="60" x2="319" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="161" y1="60" x2="319" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="161" y1="84" x2="319" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="161" y1="84" x2="319" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="371" y1="60" x2="529" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="371" y1="60" x2="529" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="371" y1="84" x2="529" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="371" y1="84" x2="529" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="581" y1="60" x2="739" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="581" y1="60" x2="739" y2="84" stroke-opacity="0.45"/>
    <line class="edge" x1="581" y1="84" x2="739" y2="60" stroke-opacity="0.45"/>
    <line class="edge" x1="581" y1="84" x2="739" y2="84" stroke-opacity="0.45"/>
    <path class="signal" d="M135,72 H765"/>
    <text class="eq" x="135" y="34" font-size="15" text-anchor="middle">sim(q, d)</text>
    <circle class="ring" cx="135" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="135" cy="72" r="18"/>
    <circle cx="135" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="135" y="128" text-anchor="middle">Busca</text>
    <text class="detail" x="135" y="156" text-anchor="middle">RAG · pgvector</text>
    <text class="eq" x="345" y="34" font-size="15" text-anchor="middle">p(y | x)</text>
    <circle class="ring" cx="345" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="345" cy="72" r="18"/>
    <circle cx="345" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="345" y="128" text-anchor="middle">LLMs</text>
    <text class="detail" x="345" y="156" text-anchor="middle">Vercel AI SDK</text>
    <text class="eq" x="555" y="34" font-size="15" text-anchor="middle">f(args)</text>
    <circle class="ring" cx="555" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="555" cy="72" r="18"/>
    <circle cx="555" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="555" y="128" text-anchor="middle">Ferramentas</text>
    <text class="detail" x="555" y="156" text-anchor="middle">tool calling · MCP</text>
    <text class="eq" x="765" y="34" font-size="15" text-anchor="middle">π(a | s)</text>
    <circle class="ring" cx="765" cy="72" r="26" stroke-dasharray="3 6"/>
    <circle class="node" cx="765" cy="72" r="18"/>
    <circle cx="765" cy="72" r="3" fill="#fafafa"/>
    <text class="stage" x="765" y="128" text-anchor="middle">Agentes</text>
    <text class="detail" x="765" y="156" text-anchor="middle">conversacionais</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="179" rx="24" fill="none" stroke="#27272a"/>
</svg>
