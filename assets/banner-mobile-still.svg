path class="mesh" d="M343.0,490.2 L440.0,345.0"/><circle class="neuron" style="animation-delay:0.525s" cx="343.0" cy="490.2" r="3"/><path class="mesh" d="M335.0,450.0 L480.2,353.0"/><circle class="neuron" style="animation-delay:0.560s" cx="335.0" cy="450.0" r="3"/><path class="mesh" d="M343.0,409.8 L514.2,375.8"/><circle class="neuron" style="animation-delay:0.595s" cx="343.0" cy="409.8" r="3"/><path class="mesh" d="M365.8,375.8 L537.0,409.8"/><circle class="neuron" style="animation-delay:0.630s" cx="365.8" cy="375.8" r="3"/><path class="mesh" d="M399.8,353.0 L490.4,450.0"/><circle class="neuron" style="animation-delay:0.665s" cx="399.8" cy="353.0" r="3"/><path class="mesh" d="M440.0,345.0 L475.6,485.6"/><circle class="neuron" style="animation-delay:0.700s" cx="440.0" cy="345.0" r="3"/><path class="mesh" d="M480.2,353.0 L440.0,500.4"/><circle class="neuron" style="animation-delay:0.735s" cx="480.2" cy="353.0" r="3"/><path class="mesh" d="M514.2,375.8 L404.4,485.6"/><circle class="neuron" style="animation-delay:0.770s" cx="514.2" cy="375.8" r="3"/><path class="mesh" d="M537.0,409.8 L389.6,450.0"/><circle class="neuron" style="animation-delay:0.805s" cx="537.0" cy="409.8" r="3"/><circle class="orbit" cx="440" cy="450" r="119"/><path class="packet" d="M321,450 H559"/><circle cx="440" cy="450" r="28" fill="#242427" stroke="#d4d4d8"/><text x="440" y="456" text-anchor="middle" class="core">IA</text>
    <text x="40" y="112" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="156" class="role">Engenheiro de IA</text><text x="40" y="200" class="body">RAG · agentes · MCP</text><text x="40" y="238" class="body">TypeScript · Python · Rust</text><text x="40" y="288" class="caption">Carreira desde 2018.</text>
    <text x="40" y="606" class="terminal" clip-path="url(#command-mask)" textLength="520" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="584" width="2" height="27"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="629" rx="24" fill="none" stroke="#27272a"/>
</svg>
