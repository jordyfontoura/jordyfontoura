    <text x="40" y="98" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="132" class="role">Engenheiro de IA</text><text x="40" y="170" class="body">RAG · agentes · MCP</text><text x="40" y="198" class="body">TypeScript · Python · Rust</text><text x="40" y="234" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="276" class="terminal" clip-path="url(#command-mask)" textLength="408" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="254" width="2" height="27"/>
  </g>
  <rect x="0.5" y="0.5" width="799" height="299" rx="24" fill="none" stroke="#27272a"/>
</svg>
