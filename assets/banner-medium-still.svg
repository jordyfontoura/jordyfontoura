<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Fontoura</title>
  <desc id="desc">Jordy Fontoura: engenheiro de IA, com RAG, agentes e MCP; carreira em software desde 2018; TypeScript, Python e Rust. Rede neural estática, sem animação.</desc>
  <defs>    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>


    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="800" height="300" rx="24"/>
    </clipPath>
    <clipPath id="command-mask"><rect class="reveal" x="40" y="250" width="408" height="40"/></clipPath>
  </defs>
  <style>
    .name { font:700 38px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#fafafa; letter-spacing:-1px; }
    .role { font:500 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#e4e4e7; }
    .body { font:400 22.1px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .caption { font:400 22.1px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .terminal,.core { font:500 20px ui-monospace,Consolas,monospace; fill:#d4d4d8; }
    .mesh { stroke:#d4d4d8; stroke-opacity:.17; fill:none; }
    .neuron { fill:#d4d4d8; opacity:.65; animation:none; }
    .orbit { fill:none; stroke:#d4d4d8; stroke-opacity:.6; stroke-dasharray:2 12; animation:none; }
    .packet { fill:none; stroke:#d4d4d8; stroke-width:2; stroke-dasharray:12 320; animation:none; opacity:0; }
    @keyframes orbit { to { stroke-dashoffset:-168; } }
    @keyframes transfer { 0% { stroke-dashoffset:332; opacity:0; } 15%,75% { opacity:.8; } 100% { stroke-dashoffset:0; opacity:0; } }
    @keyframes activate { 0%,100% { opacity:.65; } 45% { opacity:1; } }
    .reveal { width:408px; animation:none; }
    .caret { fill:#d4d4d8; opacity:0; animation:none; }
    @keyframes typing { from { width:0px; } to { width:408px; } }
    @keyframes cursor { 0% { transform:translateX(0px); opacity:1; } 99% { opacity:1; } 100% { transform:translateX(408px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .neuron,.orbit,.packet,.reveal,.caret { animation:none; } }
  </style>
  <g clip-path="url(#card)">
        <rect width="800" height="300" fill="#09090b"/>
    <rect width="800" height="300" fill="url(#dots)"/>
    <rect width="800" height="300" fill="url(#glow)"/>
    <path d="M0,52 H800" stroke="#27272a"/>
    <circle cx="24" cy="26" r="4" fill="#52525b"/><circle cx="40" cy="26" r="4" fill="#52525b"/><circle cx="56" cy="26" r="4" fill="#d4d4d8"/>
    <text x="80" y="32" class="terminal">jordy / laboratório de IA</text>
