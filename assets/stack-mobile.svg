<svg xmlns="http://www.w3.org/2000/svg" width="600" height="758" viewBox="0 0 600 758" role="img" aria-labelledby="title desc">
<title id="title">Tecnologias de trabalho</title><desc id="desc">Tecnologias por área: IA com Python, PyTorch, Vercel AI SDK, OpenAI SDK e PostgreSQL/pgvector; backend com TypeScript, Node.js, NestJS e Fastify; web com React/Next.js e Vue/Nuxt.js; infraestrutura com Docker, Kubernetes, AWS e Google Cloud; Rust em CLIs e aplicativos desktop pessoais e abertos.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fafafa" opacity=".04"/></pattern></defs>
<style>.name {font:700 32px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#fafafa;letter-spacing:-.5px} .body {font:400 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#e4e4e7} .meta {font:400 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#a1a1aa} .mini {font:500 14px ui-monospace,Consolas,monospace;fill:#d4d4d8} .line {fill:none;stroke:#a1a1aa;stroke-width:1.5} .box {fill:#18181b;stroke:#3f3f46} .index {font:500 20px ui-monospace,Consolas,monospace;fill:#a1a1aa} .mobile-name {font:700 38px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#fafafa} .mobile-body {font:400 30px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#e4e4e7} .mobile-meta {font:400 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#a1a1aa} .stack-title {font:600 27px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#fafafa} .stack-body {font:400 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#e4e4e7} .stack-mobile-title {font:600 32px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#fafafa} .stack-mobile-body {font:400 28px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:#e4e4e7} </style>
