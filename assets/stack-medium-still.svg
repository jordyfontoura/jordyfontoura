<svg xmlns="http://www.w3.org/2000/svg" width="800" height="338" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">Tecnologias de trabalho</title><desc id="desc">Tecnologias por área: IA com Python, PyTorch, Vercel AI SDK, OpenAI SDK e PostgreSQL/pgvector; backend com TypeScript, Node.js, NestJS e Fastify; web com React/Next.js e Vue/Nuxt.js; infraestrutura com Docker, Kubernetes, AWS e Google Cloud; Rust em projetos pessoais e abertos de CLIs e aplicativos desktop.</desc>
