    .eq { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif; font-style: italic; fill: #71717a; fill-opacity: 0.75; }
    .flow { fill: none; stroke: url(#flowfade); stroke-width: 1; }
    .ring { fill: none; stroke: #27272a; stroke-width: 1; }
    .edge { stroke: #3f3f46; stroke-width: 1; stroke-opacity: 0.8; }
    .node { fill: #09090b; stroke: #71717a; stroke-width: 1.5; }
    .signal { fill: none; stroke: #d4d4d8; stroke-width: 1.5; stroke-opacity: 0.8; }
    .label { font: italic 400 15px "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif; fill: #a1a1aa; }
    .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #fafafa; letter-spacing:-1px; }
    .lead { font: 400 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #d4d4d8; }
    .meta { font: 500 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #a1a1aa; }
  </style>
