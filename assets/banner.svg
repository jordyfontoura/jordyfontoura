<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Fontoura</title>
  <desc id="desc">Jordy Fontoura: engenheiro de IA, com RAG, agentes e MCP; carreira em software desde 2018; TypeScript, Python e Rust. Companheiro de código com visor de terminal: três indicadores acompanham contexto, ferramentas e produto; o visor confirma a conclusão e volta ao prompt. Movimento contínuo discreto; respeita a preferência por movimento reduzido.</desc>
  <defs>    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </radialGradient>


    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="900" height="300" rx="24"/>
    </clipPath>
    <clipPath id="command-mask"><rect class="reveal" x="40" y="250" width="367" height="40"/></clipPath>
  </defs>
  <style>
    .name { font:700 38px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#fafafa; letter-spacing:-1px; }
    .role { font:500 24px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#e4e4e7; }
    .body { font:400 21px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .caption { font:400 21px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill:#a1a1aa; }
    .terminal { font:500 18px ui-monospace,Consolas,monospace; fill:#d4d4d8; }

    .companion { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .companion-outline { stroke:#e4e4e7; stroke-width:1.8; }
    .companion-screen { fill:#09090b; stroke:#71717a; stroke-width:1.4; }
    .companion-detail,.companion-mast { stroke:#a1a1aa; stroke-width:1.6; }
    .companion-prompt,.companion-cursor,.companion-confirmation { stroke:#fafafa; stroke-width:2.5; }
    .companion-shadow { fill:#71717a; opacity:.35; animation:companion-shadow 6.4s ease-in-out infinite; }
    .companion-idle { transform-box:view-box; animation:companion-idle 6.4s ease-in-out infinite; }
    .companion-aerial { transform-box:view-box; transform-origin:0px 0px; animation:companion-aerial 6.4s ease-in-out .18s infinite; }
    .companion-antenna { fill:#d4d4d8; animation:companion-receive 6.4s ease-in-out infinite; }
    .companion-halo { fill:#d4d4d8; opacity:.07; }
    .companion-command { animation:companion-command 6.4s steps(1,end) infinite; }
    .companion-confirmation { opacity:0; animation:companion-confirmation 6.4s steps(1,end) infinite; }
    .companion-cursor { animation:companion-cursor 6.4s steps(1,end) infinite; }
    .companion-stage { fill:#d4d4d8; }
    .companion-context { animation:companion-context 6.4s linear infinite; }
    .companion-tools { animation:companion-tools 6.4s linear infinite; }
    .companion-product { animation:companion-product 6.4s linear infinite; }
    @keyframes companion-idle { 0%,100% { transform:translateY(0px); } 50% { transform:translateY(-5px); } }
    @keyframes companion-shadow { 0%,100% { opacity:.35; } 50% { opacity:.18; } }
    @keyframes companion-aerial { 0%,100% { transform:rotate(0deg); } 20% { transform:rotate(-2deg); } 60% { transform:rotate(3deg); } }
    @keyframes companion-receive { 0%,47%,100% { opacity:.6; } 50%,64% { opacity:1; } 67% { opacity:.6; } }
    @keyframes companion-command { 0%,49.99%,65%,100% { opacity:1; } 50%,64.99% { opacity:0; } }
    @keyframes companion-confirmation { 0%,49.99%,65%,100% { opacity:0; } 50%,64.99% { opacity:1; } }
    @keyframes companion-cursor { 0%,69.99%,72%,100% { opacity:1; } 70%,71.99% { opacity:0; } }
    @keyframes companion-context { 0%,9%,98%,100% { opacity:.25; } 10%,90% { opacity:1; } }
    @keyframes companion-tools { 0%,29%,98%,100% { opacity:.25; } 30%,90% { opacity:1; } }
    @keyframes companion-product { 0%,49%,98%,100% { opacity:.25; } 50%,90% { opacity:1; } }
    .reveal { width:367px; animation:typing 3.2s steps(34,end) 1 both; }
    .caret { fill:#d4d4d8; opacity:0; animation:cursor 3.2s steps(34,end) 1 both; }
    @keyframes typing { from { width:0px; } to { width:367px; } }
    @keyframes cursor { 0% { transform:translateX(0px); opacity:1; } 99% { opacity:1; } 100% { transform:translateX(367px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .companion-idle,.companion-antenna,.companion-cursor,.companion-shadow,.companion-aerial,.companion-command,.companion-confirmation,.companion-context,.companion-tools,.companion-product,.reveal,.caret { animation:none; } }
  </style>
  <g clip-path="url(#card)">
        <rect width="900" height="300" fill="#09090b"/>
    <rect width="900" height="300" fill="url(#dots)"/>
    <rect width="900" height="300" fill="url(#glow)"/>
    <path d="M0,52 H900" stroke="#27272a"/>
    <circle cx="24" cy="26" r="4" fill="#52525b"/><circle cx="40" cy="26" r="4" fill="#52525b"/><circle cx="56" cy="26" r="4" fill="#d4d4d8"/>
    <text x="80" y="32" class="terminal">jordy / laboratório de IA</text>
    <g class="companion" transform="translate(620 62) scale(1.15)">
      <ellipse class="companion-shadow" cx="100" cy="144" rx="25" ry="2"/>
      <g class="companion-idle">
        <g transform="translate(100 43)">
          <g class="companion-aerial">
            <circle class="companion-halo" cx="0" cy="-18" r="9"/>
            <path class="companion-mast" d="M0 -14V0"/>
            <rect class="companion-antenna" x="-4" y="-22" width="8" height="8" rx="1"/>
          </g>
        </g>
        <path class="companion-outline" d="M68 43H132V54H146V103H132V114H68V103H54V54H68Z"/>
        <rect class="companion-screen" x="65" y="57" width="70" height="36" rx="2"/>
        <g class="companion-command">
          <path class="companion-prompt" d="M77 67L86 75L77 83"/>
          <path class="companion-cursor" d="M98 83H117"/>
        </g>
        <path class="companion-confirmation" d="M81 75L93 85L119 65"/>
        <rect class="companion-stage companion-context" x="78" y="101" width="12" height="3" rx="1"/>
        <rect class="companion-stage companion-tools" x="96" y="101" width="12" height="3" rx="1"/>
        <rect class="companion-stage companion-product" x="114" y="101" width="12" height="3" rx="1"/>
        <path class="companion-detail" d="M54 73H44V99 M146 73H156V99 M68 114V130H83 M132 114V130H117"/>
      </g>
    </g>
    <text x="40" y="98" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="132" class="role">Engenheiro de IA</text><text x="40" y="170" class="body">RAG · agentes · MCP</text><text x="40" y="198" class="body">TypeScript · Python · Rust</text><text x="40" y="234" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="276" class="terminal" clip-path="url(#command-mask)" textLength="367" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="261" width="2" height="18"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="24" fill="none" stroke="#27272a"/>
</svg>
