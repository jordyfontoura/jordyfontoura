ath class="mesh" d="M664.8,183.1 L735.0,78.0"/><circle class="neuron" style="animation-delay:0.525s" cx="664.8" cy="183.1" r="3"/><path class="mesh" d="M659.0,154.0 L764.1,83.8"/><circle class="neuron" style="animation-delay:0.560s" cx="659.0" cy="154.0" r="3"/><path class="mesh" d="M664.8,124.9 L788.7,100.3"/><circle class="neuron" style="animation-delay:0.595s" cx="664.8" cy="124.9" r="3"/><path class="mesh" d="M681.3,100.3 L805.2,124.9"/><circle class="neuron" style="animation-delay:0.630s" cx="681.3" cy="100.3" r="3"/><path class="mesh" d="M705.9,83.8 L771.5,154.0"/><circle class="neuron" style="animation-delay:0.665s" cx="705.9" cy="83.8" r="3"/><path class="mesh" d="M735.0,78.0 L760.8,179.8"/><circle class="neuron" style="animation-delay:0.700s" cx="735.0" cy="78.0" r="3"/><path class="mesh" d="M764.1,83.8 L735.0,190.5"/><circle class="neuron" style="animation-delay:0.735s" cx="764.1" cy="83.8" r="3"/><path class="mesh" d="M788.7,100.3 L709.2,179.8"/><circle class="neuron" style="animation-delay:0.770s" cx="788.7" cy="100.3" r="3"/><path class="mesh" d="M805.2,124.9 L698.5,154.0"/><circle class="neuron" style="animation-delay:0.805s" cx="805.2" cy="124.9" r="3"/><circle class="orbit" cx="735" cy="154" r="90"/><path class="packet" d="M645,154 H825"/><circle cx="735" cy="154" r="24" fill="#242427" stroke="#d4d4d8"/><text x="735" y="160" text-anchor="middle" class="core">IA</text>
    <text x="40" y="98" class="name">Jordy Fontoura<tspan fill="#d4d4d8">.</tspan></text><text x="40" y="132" class="role">Engenheiro de IA</text><text x="40" y="170" class="body">RAG · agentes · MCP</text><text x="40" y="198" class="body">TypeScript · Python · Rust</text><text x="40" y="234" class="caption">Carreira em software desde 2018.</text>
    <text x="40" y="276" class="terminal" clip-path="url(#command-mask)" textLength="367" lengthAdjust="spacing">&gt; contexto → ferramentas → produto</text>
    <rect class="caret" x="40" y="254" width="2" height="27"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="24" fill="none" stroke="#27272a"/>
</svg>
